{% extends 'base.html' %}

{% block title %}{{ title }} &middot; {{ block.super }}{% endblock %}

{% block content %}
<div class="panel panel-narrow mx-auto border-danger">
  <div class="panel-head"><h1 class="h5 mb-0">{{ title }}</h1></div>
  <div class="panel-body">
    <p class="wrap-any"><strong>{{ name }}</strong></p>
    <p class="meta">{{ note }}</p>
    {% if hint %}<p class="meta">{{ hint }}</p>{% endif %}
    <form method="post" class="mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger btn-block mb-2">Да, удалить</button>
      <a class="btn btn-outline-secondary btn-block" href="{{ back_url }}">Отмена</a>
    </form>
  </div>
</div>
{% endblock %}
